<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>OneShot — parser console</title>
<style>
  /* Deliberately not the customer app. This is a workbench: dark, dense,
     numbers in a monospace so columns line up when you scan them. Nobody
     should ever be unsure which of the two they are looking at. */
  :root {
    --bg: #0e1113; --panel: #151a1d; --line: #242b2f; --ink: #e8edef;
    --muted: #8d989d; --accent: #4e9bd8; --warn: #e0a33e; --bad: #d4705a;
    --good: #58a97a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, "Segoe UI", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 16px 20px; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
  h1 span { color: var(--muted); font-weight: 400; }
  .spacer { flex: 1; }
  main { padding: 20px; max-width: 1180px; }
  section { margin-bottom: 30px; }
  h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--muted); margin: 0 0 4px; font-weight: 600;
  }
  .lede { color: var(--muted); font-size: 13px; margin: 0 0 12px; max-width: 70ch; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); font-weight: 600; padding: 0 10px 6px 0; border-bottom: 1px solid var(--line);
  }
  td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .num { text-align: right; font-variant-numeric: tabular-nums;
         font-family: ui-monospace, "Cascadia Mono", Menlo, monospace; }
  .term { font-weight: 600; }
  .muted { color: var(--muted); }
  .good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .kind {
    display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px;
  }
  .ex { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .diff { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .from { color: var(--muted); text-decoration: line-through; }
  .to { color: var(--ink); }
  .arrow { color: var(--muted); margin: 0 5px; }

  button {
    font: inherit; font-size: 13px; border-radius: 6px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); padding: 5px 11px; cursor: pointer;
  }
  button:hover { background: #1d2429; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.small { font-size: 12px; padding: 3px 9px; }
  button:disabled { opacity: .5; cursor: default; }
  input, select, textarea {
    background: #0b0e10; border: 1px solid var(--line); color: var(--ink);
    border-radius: 6px; padding: 7px 10px; font: inherit; min-width: 230px;
  }
  textarea { width: 100%; min-height: 62px; resize: vertical; font-size: 14px; }
  select { min-width: 210px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }

  /* The decide form, opened under the term it is about. */
  .decide {
    margin-top: 10px; padding: 12px; border: 1px solid var(--line);
    border-radius: 7px; background: #0b0e10;
  }
  .decide .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 9px; }
  /* `hidden` only works while nothing else sets display. `.decide .row` does,
     so the "Means" dropdown sat on screen on every row whatever was chosen -
     a dead control reading "Pick a workspace first…" next to a question about
     teaching. Stated once, for every hidden thing on the page. */
  [hidden] { display: none !important; }
  .decide label {
    font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); font-weight: 600; min-width: 76px;
  }
  .decide .hint { font-size: 12px; color: var(--muted); max-width: 62ch; margin: 2px 0 9px; }
  /* A question, asked in full and in sentence case - the uppercase labels
     beside the dropdowns name a field, and this is not a field, it is a
     question with a blank space under it. */
  .ask { font-size: 14px; margin: 2px 0 4px; }
  .scope-warn { color: var(--warn); font-size: 12px; }
  .pill {
    display: inline-block; font-size: 11px; border: 1px solid var(--line);
    border-radius: 999px; padding: 1px 8px; color: var(--muted); margin-right: 5px;
  }
  .pill.global { border-color: var(--accent); color: var(--accent); }
  .act-map { color: var(--good); } .act-teach { color: var(--accent); } .act-ignore { color: var(--muted); }
  /* A row has to say what went wrong before it asks for a decision. Without
     this line the screen is a list of words with no reason to touch it. */
  .says { font-size: 13px; line-height: 1.5; margin-bottom: 4px; }
  .says b { color: var(--ink, #eef1f2); }
  .cost { color: var(--accent); }
  /* What the chosen option will actually do, in the same words the person
     would use. Shown before saving, because a rule is easier to avoid than to
     undo. */
  .preview { font-size: 13px; line-height: 1.5; margin-top: 10px;
             padding: 8px 10px; border-left: 2px solid var(--accent); }
  .preview.off { border-left-color: var(--muted); color: var(--muted); }
  .why { font-size: 12px; color: var(--muted); margin-top: 4px; }

  #signin { max-width: 340px; margin: 60px auto; }
  #signin .panel > * + * { margin-top: 10px; }
  #signin input { width: 100%; }
  .err { color: var(--bad); font-size: 13px; }
  .ok { color: var(--good); font-size: 13px; }
  .empty { color: var(--muted); padding: 10px 0; }
  .ro {
    font-size: 11px; color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 9px;
  }
</style>
</head>
<body>

<div id="signin" hidden>
  <div class="panel">
    <h1>OneShot <span>— parser console</span></h1>
    <p class="lede">Maintenance crew only.</p>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="go" class="on">Sign in</button>
    <div id="signin-msg" class="err"></div>
  </div>
</div>

<div id="app" hidden>
  <header>
    <h1>OneShot <span>— parser console</span></h1>
    <span class="ro">crew</span>
    <div class="spacer"></div>
    <span id="who" class="muted"></span>
    <button id="out">Sign out</button>
  </header>

  <main>
    <div class="tabs">
      <button data-tab="overview" class="on">Overview</button>
      <button data-tab="vocab">Vocabulary</button>
      <button data-tab="rules">Rules in force</button>
      <button data-tab="edits">Corrections</button>
    </div>
    <div id="msg" class="err"></div>
    <div id="body"></div>
  </main>
</div>

<script>
// No build step and no CDN: a console that cannot be opened because an outside
// script moved is a console nobody fixes anything with. Supabase's auth and
// function endpoints are plain HTTP, so plain fetch is enough.
const SUPABASE_URL = "https://ntcvwosypcnwedxefwcr.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50Y3Z3b3N5cGNud2VkeGVmd2NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MzI0ODEsImV4cCI6MjEwMDMwODQ4MX0.rFgFqxMpN6DaE3H74Pw74nTBUuNLdHUHECkyfKZ_Dz4";
const KEY = "oneshot_console_session";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Storage is a convenience here, never a requirement: in a private window, or
// with site data blocked, every one of these throws. Signing in has to work
// anyway - it just will not be remembered.
const store = {
  get() { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch { return null; } },
  set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch { /* not remembered */ } },
  clear() { try { localStorage.removeItem(KEY); } catch { /* nothing to clear */ } },
};

let session = store.get();

async function signIn(email, password) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { apikey: ANON, "content-type": "application/json" },
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error_description || data.msg || "Sign in failed.");
  return data;
}

async function call(fn, payload) {
  const res = await fetch(`${SUPABASE_URL}/functions/v1/${fn}`, {
    method: "POST",
    headers: { "content-type": "application/json", authorization: `Bearer ${session?.access_token}` },
    body: JSON.stringify(payload),
  });
  const data = await res.json().catch(() => ({ error: "Unreadable reply" }));
  if (res.status === 401) { signOut(); throw new Error("That session expired. Sign in again."); }
  if (data.error) throw new Error(data.error);
  return data;
}

// Reading and deciding are two different functions on purpose: console-read
// holds no write action at all, so if it is ever broken into the worst case is
// a leak rather than a parser quietly taught to misread everybody's mail.
const read   = (view, extra = {}) => call("console-read", { view, ...extra });
const decide = (payload) => call("console-decide", payload);

function signOut() {
  session = null;
  store.clear();
  $("app").hidden = true;
  $("signin").hidden = false;
}

// --- rendering --------------------------------------------------------------

const pct = (v) => {
  const n = Number(v);
  if (!isFinite(n)) return '<span class="muted">—</span>';
  const cls = n >= 85 ? "good" : n >= 60 ? "warn" : "bad";
  return `<span class="${cls}">${n.toFixed(1)}%</span>`;
};

function table(head, rows, empty) {
  if (!rows.length) return `<div class="empty">${esc(empty)}</div>`;
  return `<table><thead><tr>${head.map((h) =>
    `<th class="${h.num ? "num" : ""}">${esc(h.label)}</th>`).join("")}</tr></thead>
    <tbody>${rows.join("")}</tbody></table>`;
}

function renderOverview(d) {
  const acc = d.accuracy.map((r) => `<tr>
    <td>${esc(r.workspace)}</td>
    <td>${esc(r.channel)}</td>
    <td class="muted">${esc(r.surface)}</td>
    <td>${esc(r.week)}</td>
    <td class="num">${r.proposals}</td>
    <td class="num">${r.untouched}</td>
    <td class="num">${pct(r.pct_untouched)}</td>
    <td class="num muted">${r.avg_confidence_when_right ?? "—"} / ${r.avg_confidence_when_wrong ?? "—"}</td>
  </tr>`);

  const weak = d.weak_fields.map((r) => `<tr>
    <td class="term">${esc(r.field)}</td>
    <td class="num">${r.corrections}</td>
    <td class="num ${r.workspaces > 1 ? "warn" : "muted"}">${r.workspaces}</td>
    <td class="muted">${esc(String(r.last_corrected ?? "").slice(0, 10))}</td>
  </tr>`);

  return `
    <section>
      <h2>How often the parser is right</h2>
      <p class="lede">A proposal nobody changed is one it got right. The last two
        numbers are its own confidence when it was right, and when it was wrong —
        if those are the same number, confidence means nothing yet and cannot be
        used to let it act on its own.</p>
      <div class="panel">${table(
        [{label:"Workspace"},{label:"Channel"},{label:"What"},{label:"Week"},
         {label:"Proposals",num:1},{label:"Untouched",num:1},{label:"Right first time",num:1},
         {label:"Confidence right / wrong",num:1}],
        acc, "Nothing recorded yet. It fills as jobs are created and amended.")}
      </div>
    </section>

    <section>
      <h2>Where it is weak</h2>
      <p class="lede">Fields people correct most. One workspace is a quirk of how
        that client writes; the same field in several is a parser fault worth
        fixing in the prompt.</p>
      <div class="panel">${table(
        [{label:"Field"},{label:"Corrections",num:1},{label:"Workspaces",num:1},{label:"Last"}],
        weak, "No corrections recorded yet.")}
      </div>
    </section>

    <section>
      <h2>Vocabulary waiting on a decision</h2>
      <p class="lede">Words the parser met that no workspace has an entry for.
        Counted across every workspace, because the same term tripping it in four
        places is one fix, not four. Decide them under Vocabulary.</p>
      <div class="panel">${table(
        [{label:"Term"},{label:"Kind"},{label:"Seen",num:1},{label:"Workspaces",num:1},{label:"First seen"}],
        d.vocab.map(plainVocabRow), "Nothing unrecognised yet.")}
      </div>
    </section>`;
}

function plainVocabRow(r) {
  const ex = Array.isArray(r.examples) ? r.examples.slice(0, 2) : [];
  return `<tr>
    <td>
      <div class="term">${esc(r.term)}</div>
      ${ex.map((e) => `<div class="ex">“${esc(String(e).slice(0, 120))}”</div>`).join("")}
    </td>
    <td><span class="kind">${esc(String(r.kind).replace("_", " "))}</span></td>
    <td class="num">${r.seen_total}</td>
    <td class="num ${r.workspaces > 1 ? "warn" : ""}">${r.workspaces}</td>
    <td class="muted">${esc(String(r.first_seen ?? "").slice(0, 10))}</td>
  </tr>`;
}

// --- vocabulary, with the deciding ------------------------------------------

// The rows currently on screen. Kept here rather than re-read on every click,
// so the form can be opened and closed without a round trip.
let vocabRows = [];
let openKey = null;

const rowKey = (r) => `${r.kind}::${r.normalised}`;

// What this row IS, in a sentence, and what not deciding it has cost.
//
// The screen used to show the word and the subject line it came from and
// nothing else, which reads as a list of words rather than a list of problems.
// For a client-name row that is actively misleading: the unrecognised word IS
// a customer's name, so it looks like the row is telling you who the customer
// was, rather than that nobody could place them.
function says(r) {
  const seen = Array.isArray(r.where_seen) ? r.where_seen : [];
  // Subject and verb have to agree, or the sentence reads as a glitch and
  // undoes the point of writing one: "2 workspaces has no job type by that
  // name" is not a sentence anybody trusts.
  const one = seen.length === 1;
  const who = one ? esc(seen[0].workspace)
            : seen.length > 1 ? `None of the ${seen.length} workspaces that saw it`
            : "This workspace";
  const has = one || seen.length === 0 ? "has no" : "has a";
  const none = one || seen.length === 0;
  const where = one ? esc(seen[0].workspace) : "their";
  const term = `<b>“${esc(r.term)}”</b>`;
  const times = Number(r.seen_total) > 1 ? ` Seen ${r.seen_total} times.` : "";

  switch (r.kind) {
    case "client_name":
      return `A message named ${term} as the customer. ${who} ${
        none ? "has no" : "has a"} customer by that name, so `
        + `<span class="cost">the jobs it made carry no customer and will not `
        + `appear on anybody's statement</span>.${times}`;
    case "job_type":
      return `A message asked for work called ${term}. ${who} ${
        none ? "has no" : "has a"} job type by that name, so `
        + `<span class="cost">the job carries a type the rest of the app does `
        + `not recognise</span>.${times}`;
    case "charge_type":
      return `A quote carried a line called ${term}. It is not on ${
        one ? where + "'s" : "their"} rate card, so `
        + `<span class="cost">the job was flagged as needing a price</span>.${times}`;
    default:
      return `The parser met the phrase ${term} and had nothing to do with it.`
        + `${times}`;
  }
}

function renderVocab(d) {
  vocabRows = d.rows;
  const rows = d.rows.map((r) => {
    const ex = Array.isArray(r.examples) ? r.examples.slice(0, 2) : [];
    const key = rowKey(r);
    const seen = Array.isArray(r.where_seen) ? r.where_seen : [];
    const ruled = Number(r.rules) > 0;

    return `<tr>
      <td>
        <div class="says">${says(r)}</div>
        ${ex.length ? `<div class="ex">Last seen in: ${
          ex.map((e) => `“${esc(String(e).slice(0, 140))}”`).join(", ")}</div>` : ""}
        <div class="ex">${seen.map((w) =>
          `<span class="pill">${esc(w.workspace)} · ${w.seen}${
            w.status !== "new" ? " · " + esc(w.status) : ""}</span>`).join("")}</div>
        ${openKey === key ? decideForm(r) : ""}
      </td>
      <td><span class="kind">${esc(String(r.kind).replace("_", " "))}</span></td>
      <td class="num">${r.seen_total}</td>
      <td class="num ${r.workspaces > 1 ? "warn" : ""}">${r.workspaces}</td>
      <td class="num ${ruled ? "good" : "muted"}">${
        ruled ? (r.has_global_rule ? "global" : "yes") : "—"}</td>
      <td><button class="small ${openKey === key ? "on" : ""}" data-decide="${esc(key)}">${
        ruled ? "Change" : "Decide"}</button></td>
    </tr>`;
  });

  return `<section>
    <h2>Vocabulary</h2>
    <p class="lede">Every <em>word</em> the parser has met and could not place in a
      workspace's own lists, most seen first. Each row is one word, not one
      email — the quoted subject beside it is only where that word turned up.
      A decision reaches the parser on the very next message it reads, and
      applies from then on; messages already read keep whatever they got.</p>
    <div class="panel">${table(
      [{label:"What happened"},{label:"Kind"},{label:"Seen",num:1},{label:"Workspaces",num:1},
       {label:"Rule",num:1},{label:""}],
      rows, "Nothing unrecognised yet.")}
    </div>
  </section>`;
}

// What "Map" points at, named in the words of the thing it points at rather
// than in the words of the database.
const MAP_LABEL = {
  client_name: "It is one of your customers",
  job_type:    "It is one of your job types",
  charge_type: "It is a line on your rate card",
};
const MEANS_LABEL = {
  client_name: "Which customer",
  job_type:    "Which job type",
  charge_type: "Which rate-card line",
};

function decideForm(r) {
  const seen = Array.isArray(r.where_seen) ? r.where_seen : [];
  // A plain term has nothing to point at: it is taught or ignored, never mapped.
  const mappable = r.kind !== "term";
  // The ordinary case is a word seen in one workspace. Choosing it for them
  // means the real list below can load immediately - the dropdown used to say
  // "Pick a workspace first…", so the one question this screen was meant to
  // answer ("is there something existing to connect this to?") had no visible
  // answer at all until you had already guessed your way past it.
  const only = seen.length === 1 ? seen[0] : null;

  return `<div class="decide" data-form="${esc(rowKey(r))}">
    <div class="row">
      <label>This word</label>
      <select data-f="action">
        ${mappable ? `<option value="map">${esc(MAP_LABEL[r.kind] || "Means something we already have")} — point it at the record</option>` : ""}
        <option value="teach"${mappable ? "" : " selected"}>Needs explaining — write the parser a sentence</option>
        <option value="ignore">Is not vocabulary — stop asking me about it</option>
      </select>
    </div>
    ${mappable ? "" : `<div class="why">There is nothing to point a plain phrase at,
      so this one can only be explained or ignored.</div>`}

    <div class="row">
      <label>Applies to</label>
      <select data-f="tenant">
        <option value=""${only ? "" : " selected"}>Every workspace</option>
        ${seen.map((w) => `<option value="${esc(w.tenant_id)}"${
          only && only.tenant_id === w.tenant_id ? " selected" : ""
        }>${esc(w.workspace)} only</option>`).join("")}
      </select>
      <span class="scope-warn" data-f="scopewarn" hidden>Pointing a word at a record
        has to name one workspace — the record lives in that workspace's own list.</span>
    </div>

    <div class="row" data-f="maprow" hidden>
      <label>${esc(MEANS_LABEL[r.kind] || "Means")}</label>
      <select data-f="maps_to"><option value="">Reading your list…</option></select>
    </div>

    <div data-f="teachrow" hidden>
      <div class="ask">What do you want to teach it about <b>“${esc(r.term)}”</b>?</div>
      <p class="hint">One sentence, as you would tell somebody new to the job.
        Say what the word means and what the parser should do about it —
        “a stack date is the container cut-off, so treat it as the scheduled
        date”. It is read before every message from then on.</p>
      <textarea data-f="note" rows="3"
        placeholder="e.g. “${esc(r.term)}” means …, so the parser should …"></textarea>
    </div>

    <div class="preview" data-f="preview"></div>

    <div class="row" style="margin-top:10px">
      <button class="on" data-f="save">Save rule</button>
      <button data-f="cancel">Cancel</button>
      <span data-f="msg"></span>
    </div>
  </div>`;
}

// --- rules in force ---------------------------------------------------------

function renderRules(d, log) {
  const rows = d.rows.map((r) => `<tr>
    <td>
      <div class="term">${esc(r.term)}</div>
      ${r.note ? `<div class="ex">${esc(r.note)}</div>` : ""}
    </td>
    <td><span class="kind">${esc(String(r.kind).replace("_", " "))}</span></td>
    <td class="act-${esc(r.action)}">${esc(r.action)}${
      r.maps_to ? ` <span class="muted">&rarr; ${esc(r.maps_to)}</span>` : ""}</td>
    <td><span class="pill ${r.tenant_id ? "" : "global"}">${esc(r.workspace)}</span></td>
    <td class="num ${Number(r.seen_total) ? "" : "muted"}">${r.seen_total}</td>
    <td class="muted">${esc(String(r.decided_at ?? "").slice(0, 10))}
      <div class="ex">${esc(r.decided_by_email ?? "")}</div></td>
    <td><button class="small" data-withdraw="${esc(r.id)}">Withdraw</button></td>
  </tr>`);

  const logRows = (log?.rows ?? []).map((r) => `<tr>
    <td class="muted">${esc(String(r.at).slice(0, 16).replace("T", " "))}</td>
    <td class="${r.op === "withdrawn" ? "bad" : "good"}">${esc(r.op)}</td>
    <td class="term">${esc(r.normalised)}</td>
    <td><span class="kind">${esc(String(r.kind ?? "").replace("_", " "))}</span></td>
    <td>${esc(r.action ?? "")}${r.maps_to ? ` <span class="muted">&rarr; ${esc(r.maps_to)}</span>` : ""}</td>
    <td class="muted">${esc(r.actor_email ?? "")}</td>
  </tr>`);

  return `<section>
    <h2>Rules in force</h2>
    <p class="lede">What the parser has been taught. “Seen” is how often the term
      has come up since — a rule nothing has hit is one we cannot yet say was
      right. Withdrawing puts the term back in the queue, unless another rule
      still answers it.</p>
    <div class="panel">${table(
      [{label:"Term"},{label:"Kind"},{label:"Reading"},{label:"Scope"},
       {label:"Seen",num:1},{label:"Decided"},{label:""}],
      rows, "No rules yet. Decide a term under Vocabulary and it appears here.")}
    </div>
  </section>

  <section>
    <h2>Every decision, in order</h2>
    <p class="lede">Append-only. A rule changes how every future message is read,
      so who set it and when is answerable in one place rather than inferred
      from behaviour.</p>
    <div class="panel">${table(
      [{label:"When"},{label:"What"},{label:"Term"},{label:"Kind"},{label:"Reading"},{label:"Who"}],
      logRows, "Nothing decided yet.")}
    </div>
  </section>`;
}

function renderEdits(d) {
  const rows = d.rows.map((r) => {
    const lines = Object.entries(r.edits || {}).map(([field, v]) => `
      <div class="diff"><span class="muted">${esc(field)}</span>
        <span class="from">${esc(JSON.stringify(v.from))}</span>
        <span class="arrow">&rarr;</span>
        <span class="to">${esc(JSON.stringify(v.to))}</span></div>`).join("");
    return `<tr>
      <td class="muted">${esc(String(r.created_at).slice(0, 16).replace("T", " "))}</td>
      <td>${esc(r.workspace)}<div class="ex">${esc(r.channel)} · ${esc(r.surface)}</div></td>
      <td>
        <div class="term">${esc(r.subject || "(no subject)")}</div>
        ${lines}
      </td>
      <td class="num muted">${r.confidence ?? "—"}</td>
    </tr>`;
  });
  return `<section>
    <h2>What people corrected</h2>
    <p class="lede">The actual before and after. A count tells you a field is
      weak; only this tells you why.</p>
    <div class="panel">${table(
      [{label:"When"},{label:"Where"},{label:"Correction"},{label:"Confidence",num:1}],
      rows, "No corrections recorded yet.")}
    </div>
  </section>`;
}

// --- the decide form's behaviour --------------------------------------------

function wireForm() {
  const form = document.querySelector("[data-form]");
  if (!form) return;
  const f = (name) => form.querySelector(`[data-f="${name}"]`);
  const row = vocabRows.find((r) => rowKey(r) === form.dataset.form);
  if (!row) return;

  // What saving will actually do, said before it is done. A rule is a lot
  // easier to avoid than to undo, and "Save rule" on its own tells nobody what
  // they are about to change.
  const preview = () => {
    const el = f("preview");
    const action = f("action").value;
    const tenSel = f("tenant");
    const where = tenSel.value
      ? tenSel.options[tenSel.selectedIndex].text.replace(/ only$/, "")
      : "every workspace";
    const word = `“${row.term}”`;
    el.className = "preview";

    if (action === "map") {
      const mSel = f("maps_to");
      const target = mSel.value ? mSel.options[mSel.selectedIndex].text : null;
      if (!tenSel.value) {
        el.className = "preview off";
        el.textContent = "Choose the workspace whose record this points at.";
        return;
      }
      if (!target) {
        el.className = "preview off";
        el.textContent = `Choose what ${word} means in ${where}.`;
        return;
      }
      el.innerHTML = `From the next message on, ${esc(word)} in <b>${esc(where)}</b> `
        + `will be read as <b>${esc(target)}</b>.`
        + (row.kind === "client_name"
          ? ` It is also added to that customer's other names, so the matcher uses `
            + `it everywhere — not only here.`
          : "");
      return;
    }

    if (action === "teach") {
      const note = (f("note").value || "").trim();
      if (!note) {
        el.className = "preview off";
        el.textContent = "Write the sentence the parser should read.";
        return;
      }
      el.innerHTML = `This sentence goes into the parser's instructions for `
        + `<b>${esc(where)}</b>, and it will read it before every message from now on. `
        + `It is guidance, not a lookup — it holds most of the time rather than every time.`;
      return;
    }

    el.innerHTML = `${esc(word)} stops being queued here for <b>${esc(where)}</b>. `
      + `Nothing already read changes, and the parser carries on treating it `
      + `exactly as it does now.`;
  };

  const sync = () => {
    const action = f("action").value;
    const tenant = f("tenant").value;
    f("maprow").hidden = action !== "map";
    f("teachrow").hidden = action !== "teach";
    // A global map is refused by the database too - see 44-decide.sql - but
    // saying so here means nobody has to find that out by being refused.
    f("scopewarn").hidden = !(action === "map" && !tenant);
    f("save").disabled = action === "map" && !tenant;
    preview();
  };

  // Targets are fetched only when they are needed, and only for the workspace
  // chosen: a mapping points at that workspace's own list, so there is no one
  // list to cache.
  const loadTargets = async () => {
    const sel = f("maps_to");
    const tenant = f("tenant").value;
    if (f("action").value !== "map" || !tenant) return;
    sel.innerHTML = `<option value="">Reading…</option>`;
    try {
      const { targets } = await decide({ do: "targets", tenant_id: tenant, kind: row.kind });
      sel.innerHTML = targets.length
        ? `<option value="">Pick one…</option>` + targets.map((t) =>
            `<option value="${esc(t.value)}">${esc(t.label)}</option>`).join("")
        : `<option value="">That workspace has no ${
            row.kind === "client_name" ? "customers" :
            row.kind === "job_type" ? "job types" : "rate-card lines"} yet — add one first</option>`;
    } catch (e) {
      sel.innerHTML = `<option value="">${esc(e.message)}</option>`;
    }
  };

  f("action").onchange = () => { sync(); loadTargets(); };
  f("tenant").onchange = () => { sync(); loadTargets(); };
  f("maps_to").onchange = preview;
  f("note").oninput = preview;
  f("cancel").onclick = () => { openKey = null; show(); };

  // Straight away, not on the first change: when the word was seen in one
  // workspace that workspace is already chosen, so the real customers or job
  // types are on screen the moment the form opens. That is the answer to
  // "is this connecting to something that already exists?" - showing the list
  // answers it better than any amount of wording.
  sync();
  loadTargets();

  f("save").onclick = async () => {
    const action = f("action").value;
    const payload = {
      do: "decide",
      kind: row.kind,
      term: row.term,
      action,
      tenant_id: f("tenant").value || null,
      maps_to: action === "map" ? f("maps_to").value : null,
      note: action === "teach" ? f("note").value : null,
    };
    f("msg").className = "muted";
    f("msg").textContent = "Saving…";
    f("save").disabled = true;
    try {
      await decide(payload);
      openKey = null;
      await show();
      $("msg").className = "ok";
      $("msg").textContent =
        `“${row.term}” decided. The parser picks it up on the next message it reads.`;
    } catch (e) {
      f("save").disabled = false;
      f("msg").className = "err";
      f("msg").textContent = e.message;
    }
  };

  sync();
  loadTargets();
}

function wireButtons() {
  document.querySelectorAll("[data-decide]").forEach((b) => {
    b.onclick = () => {
      openKey = openKey === b.dataset.decide ? null : b.dataset.decide;
      show();
    };
  });
  document.querySelectorAll("[data-withdraw]").forEach((b) => {
    b.onclick = async () => {
      b.disabled = true;
      b.textContent = "Withdrawing…";
      try {
        await decide({ do: "withdraw", id: b.dataset.withdraw });
        await show();
      } catch (e) {
        $("msg").className = "err";
        $("msg").textContent = e.message;
        b.disabled = false;
        b.textContent = "Withdraw";
      }
    };
  });
}

// --- wiring -----------------------------------------------------------------

let tab = "overview";

async function show() {
  $("msg").textContent = "";
  $("msg").className = "err";
  $("body").innerHTML = '<div class="empty">Reading…</div>';
  try {
    if (tab === "overview") {
      $("body").innerHTML = renderOverview(await read("overview"));
    } else if (tab === "vocab") {
      $("body").innerHTML = renderVocab(await read("vocab", { limit: 200 }));
    } else if (tab === "rules") {
      const [rules, log] = await Promise.all([
        read("rules", { limit: 200 }),
        read("decisions", { limit: 100 }),
      ]);
      $("body").innerHTML = renderRules(rules, log);
    } else {
      $("body").innerHTML = renderEdits(await read("edits", { limit: 100 }));
    }
    wireButtons();
    wireForm();
  } catch (e) {
    $("body").innerHTML = "";
    $("msg").textContent = e.message;
  }
}

document.querySelectorAll("[data-tab]").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll("[data-tab]").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
    tab = b.dataset.tab;
    openKey = null;
    show();
  };
});

$("go").onclick = async () => {
  $("signin-msg").textContent = "";
  try {
    session = await signIn($("email").value.trim(), $("password").value);
    store.set(session);
    start();
  } catch (e) { $("signin-msg").textContent = e.message; }
};
$("password").onkeydown = (e) => { if (e.key === "Enter") $("go").click(); };
$("out").onclick = signOut;

function start() {
  $("signin").hidden = true;
  $("app").hidden = false;
  $("who").textContent = session?.user?.email ?? "";
  show();
}

if (session?.access_token) start(); else $("signin").hidden = false;
</script>
