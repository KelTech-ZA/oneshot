<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#101314" />
  <title>OneShot</title>
  <style>
    /* ---- OneShot handling-label design tokens ---- */
    :root {
      --bg: #EFF1F0;          /* gallery grey */
      --card: #FFFFFF;
      --ink: #101314;
      --ink-soft: #5A6062;
      --line: #E2E6E4;
      --shadow: 0 1px 3px rgba(16,19,20,.05);
      --accent: #F04A00;      /* safety orange — handling labels */
      --ok: #1B6E4C;          /* stamp green */
      --warn: #C21B1B;        /* exception red */
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body { background: var(--bg); color: var(--ink); font-family: var(--sans);
           -webkit-font-smoothing: antialiased; line-height: 1.55; }
    #root { min-height: 100%; display: flex; flex-direction: column; }

    .topbar { display:flex; align-items:center; justify-content:space-between;
      padding: 16px 18px; position: sticky; top:0; background: var(--bg);
      border-bottom: 1px solid var(--line); z-index: 5; }
    .wordmark { font-family: var(--mono); font-weight: 700; letter-spacing: .18em;
      text-transform: uppercase; font-size: 15px; }
    .wordmark b { color: var(--accent); }

    .page { flex:1; padding: 22px 18px; max-width: 720px; width:100%; margin: 0 auto;
      padding-bottom: calc(48px + env(safe-area-inset-bottom)); }
    h1 { font-size: 24px; margin: 10px 0 22px; letter-spacing: -0.015em; }
    h2 { font-size: 11px; color: var(--ink-soft); text-transform: uppercase;
         letter-spacing: .14em; font-family: var(--mono); margin: 30px 0 12px; font-weight:600; opacity:.85; }
    h2:first-of-type { margin-top: 6px; }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 16px; margin-bottom: 12px; display:block; width:100%; text-align:left;
      color: inherit; text-decoration: none; box-shadow: var(--shadow); }
    button.card { cursor: pointer; font: inherit; }
    .card:active { transform: scale(.995); }

    .ref { font-family: var(--mono); font-weight: 600; letter-spacing: .07em; }
    .muted { color: var(--ink-soft); font-size: 13px; line-height: 1.5; }
    /* Day headings clear the sticky top bar when scrolled to. */
    [data-daykey] { scroll-margin-top: 70px; }
    .row { display:flex; align-items:center; justify-content:space-between; gap: 12px; }

    /* stamp chips — the signature element */
    .stamp { display:inline-block; font-family: var(--mono); font-size: 10px;
      font-weight: 600; letter-spacing: .13em; text-transform: uppercase;
      border: 1px solid currentColor; border-radius: 5px; padding: 3px 9px; }
    .stamp.pending { color: var(--ink-soft); }
    .stamp.live    { color: var(--accent); }
    .stamp.done    { color: var(--ok); }
    .stamp.bad     { color: var(--warn); }

    .btn { display:flex; align-items:center; justify-content:center; gap:8px;
      width:100%; min-height: 54px; border:none; border-radius: 12px;
      font-size: 16px; font-weight: 700; cursor:pointer; font-family: var(--sans); }
    .btn-primary { background: var(--ink); color:#fff; }
    .btn-accent  { background: var(--accent); color:#fff; }
    .btn-ghost   { background: transparent; color: var(--ink); border:1.5px solid var(--line); }
    .btn-warn    { background: transparent; color: var(--warn); border:1.5px solid var(--warn); }
    .btn + .btn { margin-top: 10px; }
    .quiet-actions { display:flex; justify-content:center; gap: 22px; margin-top: 12px; }
    .quiet-actions button, .quiet-actions a { background:none; border:none; font: inherit;
      font-size: 14px; color: var(--ink-soft); cursor:pointer; text-decoration:none; padding: 6px 2px; }
    .quiet-actions .danger { color: var(--warn); }
    .btn:disabled { opacity:.4; }

    input, select, textarea { width:100%; padding: 13px 14px; border:1.5px solid var(--line);
      border-radius: 12px; font: inherit; background: var(--card); margin-bottom: 12px; }
    input:focus, select:focus, textarea:focus, .btn:focus-visible, .card:focus-visible
      { outline: 2px solid var(--accent); outline-offset: 1px; }
    label { font-size: 13px; color: var(--ink-soft); display:block; margin-bottom: 4px; }

    .thumb { width: 50px; height: 50px; border-radius: 10px; object-fit: cover;
      background: var(--line); flex-shrink: 0; }
    .syncbadge { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff;
      font-family: var(--mono); font-size: 12px; letter-spacing:.08em;
      padding: 8px 14px; border-radius: 999px; z-index: 10; }
    .empty { text-align:center; color: var(--ink-soft); padding: 48px 16px; }
    /* ---- wide screens ----------------------------------------------------
       720px is a reading width, not an accident: long lines are harder to
       scan, so the job page and forms stay narrow. But a list of twenty jobs
       has no reason to waste two thirds of a monitor, so card lists flow into
       columns instead. Only pages that actually contain a card list widen -
       :has() picks them out, and browsers without it keep today's layout. */
    @media (min-width: 960px) {
      .page:has(> div > a.card) { max-width: 1140px; }

      .page > div:has(> a.card) {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
        gap: 12px;
        align-items: start;
      }
      /* the date heading spans the full row */
      .page > div:has(> a.card) > div:first-child { grid-column: 1 / -1; }
      .page > div:has(> a.card) > a.card { margin-bottom: 0; }

      /* headings and prose keep the reading width even on a wide page */
      .page > h1, .page > p { max-width: 720px; }
    }

    /* ---- The board: calendar fixed, jobs scrolling beside it ----
       A real split, not two things stacked in one scrolling page. The board
       is given an explicit pixel height in JS (it depends on the top bar, the
       notices and whatever heading sits above it), and each pane scrolls
       inside that height - so the calendar is still there at job two hundred.

       The card-column grid is repeated here because the rule above reaches
       cards through `.page > div`, and inside the board they are three levels
       deeper. Same layout, different ancestor. */
    @media (min-width: 960px) {
      .page:has(> .board) { max-width: none; }

      .board {
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr);
        gap: 22px;
        align-items: stretch;
        /* Contain the panes. Without this the board's height is a suggestion
           the content is free to ignore. */
        overflow: hidden;
      }
      /* THE line that makes a split screen a split screen. Grid and flex
         items default to min-height:auto, which means "never shrink below my
         content" - so a pane grows to fit every job, overflow-y has nothing
         to clip against, and the whole PAGE scrolls instead of the pane.
         Every box between the fixed height and the scrolling one needs it. */
      .board > *, .board-main > * { min-height: 0; }

      .board-cal {
        overflow-y: auto;
        padding-right: 4px;
        border-right: 1px solid var(--line);
      }
      .board-main { display: flex; flex-direction: column; min-width: 0; }
      /* position: relative so a day section's offsetTop is measured against
         this pane - that is what the scroll-to-day uses. */
      .board-list { flex: 1 1 0; overflow-y: auto; position: relative;
        min-width: 0; padding-right: 4px; }

      /* The landing gap for scrollIntoView, which takes no offset of its own. */
      .board-list > [data-daykey] { scroll-margin-top: 8px; }

      .board-list > div:has(> a.card) {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 12px;
        align-items: start;
      }
      .board-list > div:has(> a.card) > div:first-child { grid-column: 1 / -1; }
      .board-list > div:has(> a.card) > a.card { margin-bottom: 0; }
    }

    /* Printing wants the whole list, not one pane's worth of it. */
    @media print {
      .board { display: block !important; height: auto !important; }
      .board-cal { display: none !important; }
      .board-list { overflow: visible !important; }
    }

    /* ---- Edit job: stop cards side by side ----
       Collections, deliveries and sites read better as a row than a stack -
       the whole shape of a job is visible at once. Scoped to the stops region
       so the forms below it keep their reading width. Everything else on the
       edit screen is untouched. */
    @media (min-width: 960px) {
      .page:has(> .stops) { max-width: 1140px; }

      .stops { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 0 18px; align-items: start; }
      .stops > h2 { grid-column: 1 / -1; }
      .stops > .card { margin-bottom: 10px; }
      /* the add button sits under its own column, not across the row */
      .stops > .btn { margin-bottom: 14px; }
    }

    /* ---- Job page: costs beside the job, not buried under it ----
       Only on a real screen; the phone keeps a single column. */
    @media (min-width: 1100px) {
      .page:has(> .job-split) { max-width: 1240px; }
      .job-split {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 400px);
        gap: 28px;
        align-items: start;
      }
      .charges-panel { position: sticky; top: 18px; }
    }

    @media (prefers-reduced-motion: reduce) { * { transition:none!important; animation:none!important; } }
    /* Printing offers two documents from one page: the job card a crew member
       carries, and the same card with costs for the office. */
    /* Blocks that belong only on the printed invoice, never on screen. */
    .only-print { display: none; }

    @media print {
      .only-print { display: block; }
      .job-split { display: block; }

      /* the job card alone */
      .charges-panel { display: none; }

      /* the job card with costs behind it */
      body.print-charges .charges-panel { display: block; break-before: page; }

      /* the invoice on its own - no job card, no page break before it */
      body.print-invoice .job-main { display: none; }
      body.print-invoice .charges-panel { display: block; break-before: auto; }
    }

    /* ---- Letterhead -------------------------------------------------------
       Printed only, at the top of every document the app produces. The name
       block sits left, the document title and its date and reference right -
       the shape every invoice and delivery note in the world already has, so
       nobody has to learn to read it. */
    /* Hidden on screen by default: on a job card it would only tell the reader
       their own company's address. A statement is the exception - it IS the
       document, and you should see what the customer will see before you send
       it - so that one asks for .on-screen. */
    .letterhead { display: none; }
    .letterhead.on-screen {
      display: block; margin: 0 0 16px; padding-bottom: 10px;
      border-bottom: 1.5px solid var(--ink, #111);
    }

    /* The inside of the letterhead is laid out the same way on screen and on
       paper, so these live outside the print block. Only the sizes differ,
       below, where points make sense. */
    .letterhead-body { display: flex; align-items: flex-start; gap: 14px; }
    .letterhead-logo { max-height: 64px; max-width: 190px; object-fit: contain; flex: none; }
    .letterhead-who { flex: 1; font-size: 13px; line-height: 1.35; }
    .letterhead-name { font-size: 18px; font-weight: 700; }
    .letterhead-doc { flex: none; text-align: right; font-size: 13px; min-width: 150px; }
    .letterhead-title { font-size: 18px; font-weight: 700; letter-spacing: .06em;
                        text-transform: uppercase; margin-bottom: 4px; }
    .letterhead-metarow { display: flex; justify-content: flex-end; gap: 10px; }
    .letterhead-metalabel { color: var(--muted, #666); }
    .letterhead-metavalue { font-weight: 600; }

    @media print {
      .letterhead, .letterhead.on-screen {
        display: block !important; margin: 0 0 14px; padding-bottom: 8px;
        border-bottom: 1.5px solid #000; break-inside: avoid; break-after: avoid;
      }
      .letterhead-who { font-size: 9.5pt; color: #222; }
      .letterhead-name { font-size: 13pt; color: #000; }
      .letterhead-doc { font-size: 9.5pt; }
      .letterhead-title { font-size: 13pt; color: #000; }
      .letterhead-metalabel { color: #555; }
      .letterhead-metavalue { color: #000; }
    }

    @media print {
      /* A printed job card or invoice is a DOCUMENT, not a screenshot of the
         app. Everything a person taps belongs on screen and nowhere else. */
      .topbar, .btn, .quiet-actions, .syncbadge, .no-print,
      .notices, .stamp-legend, .empty,
      /* Navigation is not part of a document. "<- Today" was printing above
         the job reference on every card. */
      .page > a[href="/"], .page > a[href="/dashboard"] { display: none !important; }

      /* Controls: the VALUE is content, the control is not. */
      select, button, [role="button"] { display: none !important; }
      input, textarea {
        border: none !important; outline: none !important; box-shadow: none !important;
        background: transparent !important; padding: 0 !important; margin: 0 !important;
        color: #000 !important; font: inherit !important; resize: none !important;
        -webkit-appearance: none; appearance: none;
      }
      input[type="checkbox"], input[type="file"] { display: none !important; }
      label { color: #555; font-size: 10pt; }

      body { background: #fff; color: #000; font-size: 11pt; }
      .page { padding: 0; max-width: none; }
      a { color: #000; text-decoration: none; }

      /* Flat on paper: borders and shadows are screen affordances. */
      .card {
        box-shadow: none; border: none; border-bottom: 1px solid #ddd;
        border-radius: 0; padding: 6px 0; margin: 0;
        break-inside: avoid;
      }
      h1 { font-size: 17pt; margin: 0 0 2px; }
      h2 { font-size: 12pt; margin: 14px 0 4px; border-bottom: 1px solid #000;
           padding-bottom: 2px; break-after: avoid; }
      .muted { color: #444; }
      .ref { font-weight: 700; }

      .print-only { display: block !important; }
      @page { margin: 16mm 14mm; }
    }
    .print-only { display: none; }
  
    /* ---- statements -------------------------------------------------- */
    /* A money table is read by scanning one column, so the figures are
       right-aligned and tabular: 1,250.00 must line up under 14,200.00. */
    .statement-table, .aging { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    .statement-table th, .aging th {
      text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
      color: var(--muted); font-weight: 600; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line);
    }
    .statement-table td, .aging td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); }
    .statement-table .num, .aging .num { text-align: right; font-variant-numeric: tabular-nums; }
    .aging td { font-variant-numeric: tabular-nums; }
    .statement-table tr:last-child td, .aging tr:last-child td { border-bottom: none; }
    /* A receipt belongs to the invoice above it, so it is indented, lighter,
       and carries no border of its own - the eye reads invoice-then-payments
       as one block rather than as eight unrelated lines. */
    .statement-table tr.payment-row td {
      border-bottom: none; padding-top: 2px; padding-bottom: 2px;
      font-size: 13px; color: var(--muted, #666);
    }
    .statement-table tr.payment-row td:nth-child(2) { padding-left: 14px; }
    .statement-table tr.payment-row + tr:not(.payment-row) td { border-top: 1px solid var(--line); }
    @media print {
      .statement .card { border: none; padding: 0; box-shadow: none; }
      .statement-table { page-break-inside: auto; }
      .statement-table tr { page-break-inside: avoid; }
    }

    /* ---- reminders on a job ------------------------------------------- */
    /* Two ways to say a time: flick the wheel, or type it. The wheel is a
       scroll container exactly five cells tall with two blank cells padding
       each end, so the first and last value can still reach the middle; the
       snapping is what lets the component read a value back by rounding
       scrollTop rather than guessing where a flick landed. --rem-cell must stay
       in step with CELL in JobReminders.jsx - the arithmetic is shared. */
    :root { --rem-cell: 36px; }

    .rem { margin-top: 4px; }
    .rem-add { margin-top: 0; padding: 6px 12px; font-size: 13px; }
    .rem-set { margin-top: 10px; }

    .rem-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .rem-chip {
      font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 999px;
      border: 1px solid var(--line); background: transparent; color: var(--ink);
      cursor: pointer;
    }
    .rem-chip:hover { border-color: var(--accent); color: var(--accent); }
    .rem-chip:disabled { opacity: .4; cursor: default; }

    .rem-label {
      display: block; font-size: 11px; text-transform: uppercase;
      letter-spacing: .08em; color: var(--ink-soft); margin: 10px 0 4px;
    }

    .rem-time { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
    .rem-typed {
      width: 6.5em; font-family: var(--mono); font-size: 22px; font-weight: 600;
      letter-spacing: .06em; text-align: center; margin: 0;
    }
    .rem-or { font-size: 12px; padding-bottom: 10px; }

    .rem-wheels { display: flex; align-items: flex-start; gap: 2px; }
    .rem-wheel-wrap { display: flex; flex-direction: column; align-items: center; }
    .rem-wheel-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
      color: var(--ink-soft); margin-bottom: 2px;
    }
    .rem-wheel {
      height: calc(var(--rem-cell) * 5);
      width: 62px;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      border: 1px solid var(--line); border-radius: 10px;
      background: var(--bg);
    }
    .rem-wheel::-webkit-scrollbar { display: none; }
    /* The blank cells that let the first and last value reach the centre. */
    .rem-pad { height: calc(var(--rem-cell) * 2); }
    .rem-cell {
      display: flex; align-items: center; justify-content: center;
      height: var(--rem-cell); width: 100%;
      scroll-snap-align: center;
      font-family: var(--mono); font-size: 17px; font-variant-numeric: tabular-nums;
      background: none; border: none; cursor: pointer; padding: 0;
      color: var(--ink-soft); opacity: .55;
    }
    .rem-cell[data-on] {
      color: var(--ink); opacity: 1; font-weight: 700; font-size: 20px;
    }
    .rem-colon {
      font-family: var(--mono); font-size: 20px; font-weight: 700;
      align-self: center; padding-top: 14px; color: var(--ink-soft);
    }

    /* Reading the instant back in words is the only defence against a reminder
       quietly set for the wrong day, so it is not a hint - it is the loudest
       thing in the block. */
    .rem-says {
      margin-top: 14px; padding: 9px 11px; border-radius: 10px;
      background: var(--bg); border: 1px solid var(--line);
      font-size: 14px; font-weight: 600;
    }
    .rem-says.bad { color: var(--warn); border-color: var(--warn); }
    .rem-who { font-size: 12px; margin-top: 6px; }
    .rem-err { color: var(--warn); font-size: 13px; margin-top: 8px; }

    .rem-row { display: flex; align-items: flex-start; gap: 10px; }
    /* Past due and not yet dealt with: the one state that has to catch an eye. */
    .rem-row.ripe { border-color: var(--accent); border-width: 1.5px; }
    .rem-when { font-weight: 600; font-size: 14px; }
    .rem-away { font-weight: 400; font-size: 13px; }
    .rem-row .rem-note { font-size: 14px; margin-top: 2px; }
    .rem-for { font-size: 12px; margin-top: 2px; }
    .rem-acts { display: flex; align-items: center; gap: 6px; flex: none; }
    .rem-x {
      background: none; border: none; font-size: 20px; line-height: 1;
      color: var(--ink-soft); cursor: pointer; padding: 0 2px;
    }
    .rem-x:hover { color: var(--warn); }
    .rem-past { margin-bottom: 12px; }
    .rem-past summary { font-size: 13px; cursor: pointer; }
    .rem-done { font-size: 13px; padding: 3px 0 0 4px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
