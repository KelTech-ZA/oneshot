<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#101314" />
  <title>OneShot</title>
  <style>
    /* ---- OneShot handling-label design tokens ---- */
    :root {
      --bg: #EFF1F0;          /* gallery grey */
      --card: #FFFFFF;
      --ink: #101314;
      --ink-soft: #5A6062;
      --line: #E2E6E4;
      --shadow: 0 1px 3px rgba(16,19,20,.05);
      --accent: #F04A00;      /* safety orange — handling labels */
      --ok: #1B6E4C;          /* stamp green */
      --warn: #C21B1B;        /* exception red */
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body { background: var(--bg); color: var(--ink); font-family: var(--sans);
           -webkit-font-smoothing: antialiased; line-height: 1.55; }
    #root { min-height: 100%; display: flex; flex-direction: column; }

    .topbar { display:flex; align-items:center; justify-content:space-between;
      padding: 16px 18px; position: sticky; top:0; background: var(--bg);
      border-bottom: 1px solid var(--line); z-index: 5; }
    .wordmark { font-family: var(--mono); font-weight: 700; letter-spacing: .18em;
      text-transform: uppercase; font-size: 15px; }
    .wordmark b { color: var(--accent); }

    /* The ribbon's own links.
       A <button> needs its font declared or it renders in the browser's own
       button font, and the inline `font: inherit` that did that job also reset
       the SIZE - so Password and Sign out sat at 16px while Office, a plain
       link with the same class, sat at 13px. One class for all of them
       instead, at the size .muted was asking for in the first place. */
    .topbar-link {
      background: none; border: none; padding: 0; cursor: pointer;
      font-family: var(--sans); font-size: 13px; line-height: 1.5;
      color: var(--ink-soft); text-decoration: none;
    }
    .topbar-link:hover { color: var(--ink); }

    /* Which workspace this is.
       Two companies run on the same app with the same login, and the only
       thing that distinguishes their screens is the data on them - so the one
       question the ribbon has to answer at a glance is which of them you are
       looking at. It sits with the wordmark because that is where a person
       looks to find out what they are in. */
    /* The name is the only thing in the ribbon allowed to shrink.
       It first had a max-width of 44vw, which is not the same thing: on a
       390px phone "Blank Projects Contemporary (Pty) Ltd" claimed its 171px,
       squeezed the links, and Sign out wrapped - a 56px ribbon became 72px.
       Letting it take only what is left over fixes that at every width
       instead of at the one that was measured. */
    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 auto; }
    .wordmark { flex: none; }
    .brand-bar { color: var(--line); font-size: 15px; line-height: 1; flex: none; }
    .brand-ws {
      cursor: default;
      flex: 0 1 auto; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* ...and the links are the thing that never does. */
    .topbar > .row { flex: none; white-space: nowrap; }
    .brand-ws[data-switch] { cursor: pointer; }
    .brand-ws[data-switch]:hover { color: var(--accent); }

    .page { flex:1; padding: 22px 18px; max-width: 720px; width:100%; margin: 0 auto;
      padding-bottom: calc(48px + env(safe-area-inset-bottom)); }
    h1 { font-size: 24px; margin: 10px 0 22px; letter-spacing: -0.015em; }
    h2 { font-size: 11px; color: var(--ink-soft); text-transform: uppercase;
         letter-spacing: .14em; font-family: var(--mono); margin: 30px 0 12px; font-weight:600; opacity:.85; }
    h2:first-of-type { margin-top: 6px; }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 16px; margin-bottom: 12px; display:block; width:100%; text-align:left;
      color: inherit; text-decoration: none; box-shadow: var(--shadow); }
    button.card { cursor: pointer; font: inherit; }
    .card:active { transform: scale(.995); }

    .ref { font-family: var(--mono); font-weight: 600; letter-spacing: .07em; }
    .muted { color: var(--ink-soft); font-size: 13px; line-height: 1.5; }
    /* Day headings clear the sticky top bar when scrolled to. */
    [data-daykey] { scroll-margin-top: 70px; }
    .row { display:flex; align-items:center; justify-content:space-between; gap: 12px; }

    /* stamp chips — the signature element */
    .stamp { display:inline-block; font-family: var(--mono); font-size: 10px;
      font-weight: 600; letter-spacing: .13em; text-transform: uppercase;
      border: 1px solid currentColor; border-radius: 5px; padding: 3px 9px; }
    .stamp.pending { color: var(--ink-soft); }
    .stamp.live    { color: var(--accent); }
    .stamp.done    { color: var(--ok); }
    .stamp.bad     { color: var(--warn); }

    .btn { display:flex; align-items:center; justify-content:center; gap:8px;
      width:100%; min-height: 54px; border:none; border-radius: 12px;
      font-size: 16px; font-weight: 700; cursor:pointer; font-family: var(--sans); }
    .btn-primary { background: var(--ink); color:#fff; }
    .btn-accent  { background: var(--accent); color:#fff; }
    .btn-ghost   { background: transparent; color: var(--ink); border:1.5px solid var(--line); }
    .btn-warn    { background: transparent; color: var(--warn); border:1.5px solid var(--warn); }
    .btn + .btn { margin-top: 10px; }
    .quiet-actions { display:flex; justify-content:center; gap: 22px; margin-top: 12px; }
    .quiet-actions button, .quiet-actions a { background:none; border:none; font: inherit;
      font-size: 14px; color: var(--ink-soft); cursor:pointer; text-decoration:none; padding: 6px 2px; }
    .quiet-actions .danger { color: var(--warn); }
    .btn:disabled { opacity:.4; }

    input, select, textarea { width:100%; padding: 13px 14px; border:1.5px solid var(--line);
      border-radius: 12px; font: inherit; background: var(--card); margin-bottom: 12px; }
    input:focus, select:focus, textarea:focus, .btn:focus-visible, .card:focus-visible
      { outline: 2px solid var(--accent); outline-offset: 1px; }
    label { font-size: 13px; color: var(--ink-soft); display:block; margin-bottom: 4px; }

    .thumb { width: 50px; height: 50px; border-radius: 10px; object-fit: cover;
      background: var(--line); flex-shrink: 0; }
    .syncbadge { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff;
      font-family: var(--mono); font-size: 12px; letter-spacing:.08em;
      padding: 8px 14px; border-radius: 999px; z-index: 10; }
    .empty { text-align:center; color: var(--ink-soft); padding: 48px 16px; }
    /* ---- wide screens ----------------------------------------------------
       720px is a reading width, not an accident: long lines are harder to
       scan, so the job page and forms stay narrow. But a list of twenty jobs
       has no reason to waste two thirds of a monitor, so card lists flow into
       columns instead. Only pages that actually contain a card list widen -
       :has() picks them out, and browsers without it keep today's layout. */
    @media (min-width: 960px) {
      .page:has(> div > a.card) { max-width: 1140px; }

      .page > div:has(> a.card) {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
        gap: 12px;
        align-items: start;
      }
      /* the date heading spans the full row */
      .page > div:has(> a.card) > div:first-child { grid-column: 1 / -1; }
      .page > div:has(> a.card) > a.card { margin-bottom: 0; }

      /* headings and prose keep the reading width even on a wide page */
      .page > h1, .page > p { max-width: 720px; }
    }

    /* ---- The board: calendar fixed, jobs scrolling beside it ----
       A real split, not two things stacked in one scrolling page. The board
       is given an explicit pixel height in JS (it depends on the top bar, the
       notices and whatever heading sits above it), and each pane scrolls
       inside that height - so the calendar is still there at job two hundred.

       The card-column grid is repeated here because the rule above reaches
       cards through `.page > div`, and inside the board they are three levels
       deeper. Same layout, different ancestor. */
    @media (min-width: 960px) {
      .page:has(> .board) { max-width: none; }

      .board {
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr);
        gap: 22px;
        align-items: stretch;
        /* Contain the panes. Without this the board's height is a suggestion
           the content is free to ignore. */
        overflow: hidden;
      }
      /* THE line that makes a split screen a split screen. Grid and flex
         items default to min-height:auto, which means "never shrink below my
         content" - so a pane grows to fit every job, overflow-y has nothing
         to clip against, and the whole PAGE scrolls instead of the pane.
         Every box between the fixed height and the scrolling one needs it. */
      .board > *, .board-main > * { min-height: 0; }

      .board-cal {
        overflow-y: auto;
        padding-right: 4px;
        border-right: 1px solid var(--line);
      }
      .board-main { display: flex; flex-direction: column; min-width: 0; }
      /* position: relative so a day section's offsetTop is measured against
         this pane - that is what the scroll-to-day uses. */
      .board-list { flex: 1 1 0; overflow-y: auto; position: relative;
        min-width: 0; padding-right: 4px; }

      /* The landing gap for scrollIntoView, which takes no offset of its own. */
      .board-list > [data-daykey] { scroll-margin-top: 8px; }

      .board-list > div:has(> a.card) {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 12px;
        align-items: start;
      }
      .board-list > div:has(> a.card) > div:first-child { grid-column: 1 / -1; }
      .board-list > div:has(> a.card) > a.card { margin-bottom: 0; }
    }

    /* Printing wants the whole list, not one pane's worth of it. */
    @media print {
      .board { display: block !important; height: auto !important; }
      .board-cal { display: none !important; }
      .board-list { overflow: visible !important; }
    }

    /* ---- Edit job: stop cards side by side ----
       Collections, deliveries and sites read better as a row than a stack -
       the whole shape of a job is visible at once. Scoped to the stops region
       so the forms below it keep their reading width. Everything else on the
       edit screen is untouched. */
    @media (min-width: 960px) {
      .page:has(> .stops) { max-width: 1140px; }

      .stops { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 0 18px; align-items: start; }
      .stops > h2 { grid-column: 1 / -1; }
      .stops > .card { margin-bottom: 10px; }
      /* the add button sits under its own column, not across the row */
      .stops > .btn { margin-bottom: 14px; }
    }

    /* ---- Job page: costs beside the job, not buried under it ----
       Only on a real screen; the phone keeps a single column. */
    @media (min-width: 1100px) {
      .page:has(> .job-split) { max-width: 1240px; }
      .job-split {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 400px);
        gap: 28px;
        align-items: start;
      }
      .charges-panel { position: sticky; top: 18px; }
    }

    @media (prefers-reduced-motion: reduce) { * { transition:none!important; animation:none!important; } }
    /* Printing offers two documents from one page: the job card a crew member
       carries, and the same card with costs for the office. */
    /* Blocks that belong only on the printed invoice, never on screen. */
    .only-print { display: none; }

    @media print {
      .only-print { display: block; }
      .job-split { display: block; }

      /* the job card alone */
      .charges-panel { display: none; }

      /* the job card with costs behind it */
      body.print-charges .charges-panel { display: block; break-before: page; }

      /* the invoice on its own - no job card, no page break before it */
      body.print-invoice .job-main { display: none; }
      body.print-invoice .charges-panel { display: block; break-before: auto; }
    }

    /* ---- Letterhead -------------------------------------------------------
       Printed only, at the top of every document the app produces. The name
       block sits left, the document title and its date and reference right -
       the shape every invoice and delivery note in the world already has, so
       nobody has to learn to read it. */
    /* Hidden on screen by default: on a job card it would only tell the reader
       their own company's address. A statement is the exception - it IS the
       document, and you should see what the customer will see before you send
       it - so that one asks for .on-screen. */
    .letterhead { display: none; }
    .letterhead.on-screen {
      display: block; margin: 0 0 16px; padding-bottom: 10px;
      border-bottom: 1.5px solid var(--ink, #111);
    }

    /* The inside of the letterhead is laid out the same way on screen and on
       paper, so these live outside the print block. Only the sizes differ,
       below, where points make sense. */
    .letterhead-body { display: flex; align-items: flex-start; gap: 14px; }
    .letterhead-logo { max-height: 64px; max-width: 190px; object-fit: contain; flex: none; }
    .letterhead-who { flex: 1; font-size: 13px; line-height: 1.35; }
    .letterhead-name { font-size: 18px; font-weight: 700; }
    .letterhead-doc { flex: none; text-align: right; font-size: 13px; min-width: 150px; }
    .letterhead-title { font-size: 18px; font-weight: 700; letter-spacing: .06em;
                        text-transform: uppercase; margin-bottom: 4px; }
    .letterhead-metarow { display: flex; justify-content: flex-end; gap: 10px; }
    .letterhead-metalabel { color: var(--muted, #666); }
    .letterhead-metavalue { font-weight: 600; }

    @media print {
      .letterhead, .letterhead.on-screen {
        display: block !important; margin: 0 0 14px; padding-bottom: 8px;
        border-bottom: 1.5px solid #000; break-inside: avoid; break-after: avoid;
      }
      .letterhead-who { font-size: 9.5pt; color: #222; }
      .letterhead-name { font-size: 13pt; color: #000; }
      .letterhead-doc { font-size: 9.5pt; }
      .letterhead-title { font-size: 13pt; color: #000; }
      .letterhead-metalabel { color: #555; }
      .letterhead-metavalue { color: #000; }
    }

    @media print {
      /* A printed job card or invoice is a DOCUMENT, not a screenshot of the
         app. Everything a person taps belongs on screen and nowhere else. */
      .topbar, .btn, .quiet-actions, .syncbadge, .no-print,
      .notices, .stamp-legend, .empty,
      /* Navigation is not part of a document. "<- Today" was printing above
         the job reference on every card. */
      .page > a[href="/"], .page > a[href="/dashboard"] { display: none !important; }

      /* Controls: the VALUE is content, the control is not. */
      select, button, [role="button"] { display: none !important; }
      input, textarea {
        border: none !important; outline: none !important; box-shadow: none !important;
        background: transparent !important; padding: 0 !important; margin: 0 !important;
        color: #000 !important; font: inherit !important; resize: none !important;
        -webkit-appearance: none; appearance: none;
      }
      input[type="checkbox"], input[type="file"] { display: none !important; }
      label { color: #555; font-size: 10pt; }

      body { background: #fff; color: #000; font-size: 11pt; }
      .page { padding: 0; max-width: none; }
      a { color: #000; text-decoration: none; }

      /* Flat on paper: borders and shadows are screen affordances. */
      .card {
        box-shadow: none; border: none; border-bottom: 1px solid #ddd;
        border-radius: 0; padding: 6px 0; margin: 0;
        break-inside: avoid;
      }
      h1 { font-size: 17pt; margin: 0 0 2px; }
      h2 { font-size: 12pt; margin: 14px 0 4px; border-bottom: 1px solid #000;
           padding-bottom: 2px; break-after: avoid; }
      .muted { color: #444; }
      .ref { font-weight: 700; }

      .print-only { display: block !important; }
      @page { margin: 16mm 14mm; }
    }
    .print-only { display: none; }
  
    /* ---- statements -------------------------------------------------- */
    /* A money table is read by scanning one column, so the figures are
       right-aligned and tabular: 1,250.00 must line up under 14,200.00. */
    .statement-table, .aging { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    .statement-table th, .aging th {
      text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
      color: var(--muted); font-weight: 600; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line);
    }
    .statement-table td, .aging td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); }
    .statement-table .num, .aging .num { text-align: right; font-variant-numeric: tabular-nums; }
    .aging td { font-variant-numeric: tabular-nums; }
    .statement-table tr:last-child td, .aging tr:last-child td { border-bottom: none; }
    /* A receipt belongs to the invoice above it, so it is indented, lighter,
       and carries no border of its own - the eye reads invoice-then-payments
       as one block rather than as eight unrelated lines. */
    .statement-table tr.payment-row td {
      border-bottom: none; padding-top: 2px; padding-bottom: 2px;
      font-size: 13px; color: var(--muted, #666);
    }
    .statement-table tr.payment-row td:nth-child(2) { padding-left: 14px; }
    .statement-table tr.payment-row + tr:not(.payment-row) td { border-top: 1px solid var(--line); }
    @media print {
      .statement .card { border: none; padding: 0; box-shadow: none; }
      .statement-table { page-break-inside: auto; }
      .statement-table tr { page-break-inside: avoid; }
    }

    /* ---- reminders on a job ------------------------------------------- */
    /* Two ways to say a time: flick the wheel, or type it. The wheel is a
       scroll container exactly five cells tall with two blank cells padding
       each end, so the first and last value can still reach the middle; the
       snapping is what lets the component read a value back by rounding
       scrollTop rather than guessing where a flick landed. --rem-cell must stay
       in step with CELL in JobReminders.jsx - the arithmetic is shared. */
    :root { --rem-cell: 36px; }

    .rem { margin-top: 4px; }
    .rem-add { margin-top: 0; padding: 6px 12px; font-size: 13px; }
    .rem-set { margin-top: 10px; }

    .rem-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .rem-chip {
      font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 999px;
      border: 1px solid var(--line); background: transparent; color: var(--ink);
      cursor: pointer;
    }
    .rem-chip:hover { border-color: var(--accent); color: var(--accent); }
    .rem-chip:disabled { opacity: .4; cursor: default; }

    .rem-label {
      display: block; font-size: 11px; text-transform: uppercase;
      letter-spacing: .08em; color: var(--ink-soft); margin: 10px 0 4px;
    }

    .rem-time { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
    .rem-typed {
      width: 6.5em; font-family: var(--mono); font-size: 22px; font-weight: 600;
      letter-spacing: .06em; text-align: center; margin: 0;
    }
    .rem-or { font-size: 12px; padding-bottom: 10px; }

    .rem-wheels { display: flex; align-items: flex-start; gap: 2px; }
    .rem-wheel-wrap { display: flex; flex-direction: column; align-items: center; }
    .rem-wheel-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
      color: var(--ink-soft); margin-bottom: 2px;
    }
    .rem-wheel {
      height: calc(var(--rem-cell) * 5);
      width: 62px;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      border: 1px solid var(--line); border-radius: 10px;
      background: var(--bg);
    }
    .rem-wheel::-webkit-scrollbar { display: none; }
    /* The blank cells that let the first and last value reach the centre. */
    .rem-pad { height: calc(var(--rem-cell) * 2); }
    .rem-cell {
      display: flex; align-items: center; justify-content: center;
      height: var(--rem-cell); width: 100%;
      scroll-snap-align: center;
      font-family: var(--mono); font-size: 17px; font-variant-numeric: tabular-nums;
      background: none; border: none; cursor: pointer; padding: 0;
      color: var(--ink-soft); opacity: .55;
    }
    .rem-cell[data-on] {
      color: var(--ink); opacity: 1; font-weight: 700; font-size: 20px;
    }
    .rem-colon {
      font-family: var(--mono); font-size: 20px; font-weight: 700;
      align-self: center; padding-top: 14px; color: var(--ink-soft);
    }

    /* Reading the instant back in words is the only defence against a reminder
       quietly set for the wrong day, so it is not a hint - it is the loudest
       thing in the block. */
    .rem-says {
      margin-top: 14px; padding: 9px 11px; border-radius: 10px;
      background: var(--bg); border: 1px solid var(--line);
      font-size: 14px; font-weight: 600;
    }
    .rem-says.bad { color: var(--warn); border-color: var(--warn); }
    .rem-who { font-size: 12px; margin-top: 6px; }
    .rem-err { color: var(--warn); font-size: 13px; margin-top: 8px; }

    .rem-row { display: flex; align-items: flex-start; gap: 10px; }
    /* Past due and not yet dealt with: the one state that has to catch an eye. */
    .rem-row.ripe { border-color: var(--accent); border-width: 1.5px; }
    .rem-when { font-weight: 600; font-size: 14px; }
    .rem-away { font-weight: 400; font-size: 13px; }
    .rem-row .rem-note { font-size: 14px; margin-top: 2px; }
    .rem-for { font-size: 12px; margin-top: 2px; }
    .rem-acts { display: flex; align-items: center; gap: 6px; flex: none; }
    .rem-x {
      background: none; border: none; font-size: 20px; line-height: 1;
      color: var(--ink-soft); cursor: pointer; padding: 0 2px;
    }
    .rem-x:hover { color: var(--warn); }
    /* What the workspace has learned, offered. Marked out from the reminders
       themselves - this is the app saying something, not a record of what
       somebody decided, and the two must not be mistaken for each other. */
    .rem-learned { border-left: 3px solid var(--accent); }
    .rem-learned-say { font-weight: 600; font-size: 14px; }
    .rem-take { margin-top: 10px; }
    .rem-past { margin-bottom: 12px; }
    .rem-past summary { font-size: 13px; cursor: pointer; }
    .rem-done { font-size: 13px; padding: 3px 0 0 4px; }

    /* ---------------------------------------------------------------------
       The landing page.

       What a stranger gets at the root when nobody is signed in. It is the
       only screen in the app written for someone who does not yet know what
       any of this is, so it is the only one allowed wider measures, larger
       type and inline buttons - everywhere else .btn is full width because a
       thumb is using it in a van.

       It keeps the app's own furniture on purpose: the wordmark, the stamp
       chips, the mono labels. Somebody who signs up should recognise the
       place they land in as the place they were just reading about.
       --------------------------------------------------------------------- */
    .lp { flex: 1; width: 100%; }
    .lp section, .lp-bar, .lp-foot {
      max-width: 1000px; margin: 0 auto;
      padding-left: max(18px, env(safe-area-inset-left));
      padding-right: max(18px, env(safe-area-inset-right));
    }

    .lp-bar { display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding-top: 18px; padding-bottom: 18px; }
    .lp-bar-links { display: flex; align-items: center; gap: 16px; }
    .lp-mini { background: var(--ink); color: #fff; border: none; border-radius: 9px;
      font: inherit; font-size: 13px; font-weight: 700; padding: 9px 14px; cursor: pointer; }
    .lp-mini:hover { background: var(--accent); }

    .lp-hero { padding-block: 26px 44px; display: grid; gap: 18px; justify-items: start; }
    /* A long statement headline rather than a short slogan: it needs a wider
       measure and a smaller top end, or it fills the first screen on its own
       and pushes the screenshot out of view. */
    .lp-h1 { font-size: clamp(27px, 4.1vw, 40px); font-weight: 800;
      line-height: 1.08; letter-spacing: -.025em; margin: 0; max-width: 24ch;
      text-wrap: balance; }
    .lp-sub { font-size: clamp(16px, 2.1vw, 19px); line-height: 1.5; max-width: 54ch; }
    .lp-cta { display: flex; flex-wrap: wrap; gap: 10px; }
    .lp-btn { border: none; border-radius: 12px; font: inherit; font-size: 16px;
      font-weight: 700; padding: 15px 22px; cursor: pointer; min-height: 54px; }
    .lp-btn-accent { background: var(--accent); color: #fff; }
    .lp-btn-ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
    .lp-btn-wide { width: 100%; max-width: 340px; }
    .lp-fine { margin: 0; }

    /* The one thing on the page that shows instead of telling. */
    .lp-demo { display: grid; grid-template-columns: 1fr 28px 1fr; gap: 12px;
      align-items: center; width: 100%; margin-top: 10px; }
    .lp-pane { background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; box-shadow: var(--shadow); padding: 14px;
      display: grid; gap: 8px; min-width: 0; }
    .lp-pane-out { border-color: var(--ink); }
    .lp-tag { font-family: var(--mono); font-size: 10px; font-weight: 600;
      letter-spacing: .13em; text-transform: uppercase; color: var(--ink-soft); }
    .lp-msg { font-size: 14px; line-height: 1.5; margin: 0; }
    .lp-msg mark { background: rgba(240,74,0,.16); color: inherit;
      padding: 0 2px; border-radius: 3px; }
    .lp-go { justify-self: center; color: var(--accent); font-size: 20px; font-weight: 800; }
    .lp-jtop { align-items: baseline; }
    .lp-kv { display: grid; grid-template-columns: 62px 1fr; gap: 4px 10px;
      font-size: 13px; margin: 0; }
    .lp-kv dt { font-family: var(--mono); font-size: 10px; letter-spacing: .07em;
      text-transform: uppercase; color: var(--ink-soft); padding-top: 2px; }
    .lp-kv dd { margin: 0; }

    /* Live counts. Printed only when the database answers. */
    .lp-proof { padding-block: 26px; border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line); display: grid; gap: 16px; }
    .lp-proof-head { display: flex; flex-wrap: wrap; gap: 6px 16px;
      align-items: baseline; justify-content: space-between; }
    .lp-figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 18px; }
    .lp-fig-n { font-family: var(--mono); font-size: clamp(26px, 4.4vw, 38px);
      font-weight: 600; letter-spacing: -.02em; line-height: 1.1;
      font-variant-numeric: tabular-nums; }
    .lp-fig-l { font-size: 13px; color: var(--ink-soft); line-height: 1.35; margin-top: 2px; }

    .lp-h2 { font-family: var(--mono); font-size: 11px; font-weight: 600;
      letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft);
      margin: 0 0 14px; }
    .lp-does { padding-block: 34px; }
    /* Two by two, not auto-fit: four cards in a three-up grid leave one
       sitting alone on a row, which reads as a card that got cut. */
    .lp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    @media (max-width: 680px) { .lp-grid { grid-template-columns: 1fr; } }
    .lp-card { background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; box-shadow: var(--shadow); padding: 18px;
      display: grid; gap: 7px; align-content: start; min-width: 0; }
    .lp-n { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--accent); }
    .lp-card h3 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; margin: 0; }
    .lp-card p { font-size: 14px; line-height: 1.5; color: var(--ink-soft); margin: 0; }

    .lp-honest { padding-block: 10px 34px; }
    .lp-honest ul { margin: 0; padding-left: 18px; display: grid; gap: 7px;
      font-size: 14.5px; line-height: 1.5; color: var(--ink-soft); max-width: 68ch; }
    .lp-honest li::marker { color: var(--accent); }

    .lp-end { padding-block: 34px; border-top: 1px solid var(--line);
      display: grid; gap: 14px; justify-items: start; }
    .lp-end-h { font-size: clamp(21px, 3.2vw, 30px); line-height: 1.14;
      letter-spacing: -.02em; font-weight: 800; margin: 0; max-width: 24ch;
      text-wrap: balance; text-transform: none; font-family: var(--sans);
      color: var(--ink); }
    .lp-end p { font-size: 15.5px; line-height: 1.5; max-width: 56ch; margin: 0; }

    .lp-foot { padding-block: 22px 40px; border-top: 1px solid var(--line);
      display: grid; gap: 8px; }

    @media (max-width: 640px) {
      .lp-demo { grid-template-columns: 1fr; }
      .lp-go { transform: rotate(90deg); }
      .lp-btn { width: 100%; }
      .lp-cta { width: 100%; }
    }

    /* The screenshot. It is the only thing on the page a sceptical reader
       will actually study, so it gets the width and a frame that reads as a
       window rather than a decorative card. */
    /* justify-self: stretch is load-bearing. .lp-hero sets justify-items:
       start so the headline and buttons size to their content, and without
       this the figure does too - which means the image renders at its own
       1536px and pushes the whole page sideways on a phone. */
    .lp-shot { margin: 4px 0 0; display: grid; gap: 9px; width: 100%;
      justify-self: stretch; min-width: 0; }
    .lp-shot img { width: 100%; height: auto; display: block;
      border: 1px solid var(--line); border-radius: 12px;
      box-shadow: 0 8px 28px rgba(16,19,20,.10); background: var(--card); }
    .lp-shot figcaption { font-size: 12.5px; }

    /* One quote, in his own words, carrying the whole time-saved claim. */
    .lp-quote { padding-block: 30px; display: grid; gap: 12px; }
    .lp-quote blockquote { margin: 0; font-size: clamp(18px, 2.7vw, 25px);
      line-height: 1.38; letter-spacing: -.015em; font-weight: 600;
      max-width: 42ch; text-wrap: pretty;
      border-left: 3px solid var(--accent); padding-left: 16px; }
    .lp-quote figcaption { font-size: 13.5px; color: var(--ink-soft); padding-left: 19px; }

    .lp-lead { font-size: 16px; line-height: 1.5; max-width: 56ch; margin: -6px 0 16px; }
    .lp-ways { padding-block: 10px 34px; display: grid; gap: 14px; justify-items: start; }
    .lp-waygrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1px; background: var(--line); border: 1px solid var(--line);
      border-radius: 12px; overflow: hidden; width: 100%; }
    .lp-way { background: var(--card); padding: 15px 16px; display: grid; gap: 5px; min-width: 0; }
    .lp-way b { font-size: 15px; }
    .lp-way span { font-size: 13.5px; line-height: 1.45; color: var(--ink-soft); }
    .lp-btn-sm { min-height: 46px; padding: 12px 18px; font-size: 15px; }

    /* ---------------------------------------------------------------------
       What people are saying, and the box to say it in.

       The form is the point of this section, not the quotes above it: on the
       day it ships there are no approved notes at all, so it has to look
       deliberate while empty rather than look like a feature that failed to
       load. Hence the box carries its own heading and sits in a framed panel
       of its own - it reads as an invitation with or without anything above it.
       --------------------------------------------------------------------- */
    .lp-say { padding-block: 10px 34px; display: grid; gap: 16px; }

    /* Masonry would be neater and is not worth a layout dependency. Equal
       columns with top-aligned cards, so notes of different lengths sit level
       at the top rather than floating in the middle of their box. */
    .lp-notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px; align-items: start; }
    .lp-note { background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; box-shadow: var(--shadow); padding: 16px 17px;
      margin: 0; display: grid; gap: 9px; min-width: 0; }
    .lp-note blockquote { margin: 0; font-size: 14.5px; line-height: 1.5;
      /* The quote marks are drawn rather than typed so a note that opens with
         a dash or a number does not end up with one hanging in front of it. */
      quotes: "\201C" "\201D"; text-wrap: pretty; overflow-wrap: anywhere; }
    .lp-note blockquote::before { content: open-quote; color: var(--accent); font-weight: 700; }
    .lp-note blockquote::after { content: close-quote; color: var(--accent); font-weight: 700; }
    /* Two routes in — the extension and the phone — side by side on a laptop,
       stacked and full width on a phone, where one of them is the point. */
    .lp-waybtns { display: flex; flex-wrap: wrap; gap: 10px; }
    @media (max-width: 460px) {
      .lp-waybtns { display: grid; }
      .lp-waybtns .lp-btn { width: 100%; }
    }

    /* No figcaption: the reviews are anonymous, so there is nobody to credit.
       The stars are the only thing standing in for a byline. */

    /* ---------------------------------------------------------------------
       Stars, read-only.

       Two copies of the same five glyphs, the filled one laid over the empty
       one and clipped to a percentage. A half-star glyph would force every
       average onto a 0.5 step, and then 4.4 would be drawn as 4.5 beside the
       number 4.4 - a small lie, but one the reader can see.
       --------------------------------------------------------------------- */
    /* width and justify-self are load-bearing. As a grid item inside .lp-note
       this span would otherwise stretch to the card, and the filled copy would
       be clipped to a percentage of the CARD rather than of the glyphs - so
       three stars out of five drew all five and the card lied. */
    .lp-stars-out { position: relative; display: inline-block; flex: none;
      width: max-content; justify-self: start;
      line-height: 1; letter-spacing: .08em; white-space: nowrap;
      color: var(--line); vertical-align: middle; }
    .lp-stars-fg { position: absolute; inset: 0; overflow: hidden;
      color: var(--accent); white-space: nowrap; }

    .lp-say-head { display: flex; flex-wrap: wrap; gap: 6px 16px;
      align-items: baseline; justify-content: space-between; }
    .lp-say-head .lp-h2 { margin-bottom: 0; }
    .lp-avg { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .lp-avg b { font-family: var(--mono); font-size: 17px; font-weight: 600;
      font-variant-numeric: tabular-nums; }

    .lp-saybox { background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; box-shadow: var(--shadow); padding: 20px;
      display: grid; gap: 4px; }
    .lp-say-h { font-size: clamp(17px, 2.4vw, 21px); font-weight: 800;
      letter-spacing: -.015em; line-height: 1.2; margin: 0; max-width: 34ch;
      text-wrap: balance; }
    .lp-say-lead { font-size: 14px; line-height: 1.5; max-width: 56ch; margin: 0 0 6px; }

    .lp-form { display: grid; gap: 0; }
    .lp-form label { display: block; min-width: 0; }
    .lp-form textarea { resize: vertical; min-height: 108px; line-height: 1.5; }

    /* ---------------------------------------------------------------------
       Stars you press.

       Radio inputs behind the glyphs: keyboard and screen readers get a real
       rating control, and the pointer gets five big targets. 40px, because
       this is the one thing on the page a visitor does with their thumb.
       --------------------------------------------------------------------- */
    .lp-rate { border: 0; padding: 0; margin: 0 0 16px; min-width: 0; }
    .lp-rate legend { padding: 0; font-size: 12.5px; font-weight: 600;
      color: var(--ink-soft); margin-bottom: 4px; }
    .lp-rate-row { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
    .lp-form label.lp-star { display: inline-flex; align-items: center;
      justify-content: center; width: 40px; height: 40px; flex: none;
      cursor: pointer; font-size: 27px; line-height: 1; color: var(--line);
      border-radius: 9px; transition: color .08s ease, transform .08s ease; }
    .lp-form label.lp-star.on { color: var(--accent); }
    .lp-form label.lp-star:active { transform: scale(.92); }
    /* The radio is off-screen, so the ring has to be put back by hand or the
       control is invisible to anybody tabbing through the page. */
    .lp-form label.lp-star:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
    .lp-rate-say { font-size: 13.5px; margin-left: 8px; }
    @media (hover: none) { .lp-rate-say { display: none; } }

    /* One box with a placeholder needs no visible label, but it still needs a
       label - a screen reader announcing "edit text, blank" is not a form. */
    .lp-sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

    /* Off-screen rather than display:none - a bot that skips hidden inputs is
       exactly the bot this is trying to catch. */
    .lp-hp { position: absolute; left: -9999px; width: 1px; height: 1px;
      overflow: hidden; }

    .lp-err { margin: 0 0 12px; font-size: 14px; line-height: 1.45;
      color: var(--accent); font-weight: 600; }

    .lp-form .lp-fine { margin-top: 10px; font-size: 12.5px; line-height: 1.45;
      max-width: 54ch; }

    /* The form is a grid, which stretches every child the full width - fine for
       the inputs, wrong for the button, which then reads as a page-width banner
       rather than the end of a form. */
    .lp-form button[type="submit"] { justify-self: start; }

    .lp-thanks { display: grid; gap: 6px; padding: 16px 0 4px; font-size: 14.5px;
      line-height: 1.5; max-width: 54ch; }
    .lp-thanks b { font-size: 16px; }

    @media (max-width: 640px) {
      .lp-form button[type="submit"] { justify-self: stretch; }
    }

    /* The parsed item list. Dimensions are the detail that tells a logistics
       reader the parser actually read the message rather than skimmed it. */
    .lp-items { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 4px;
      border-top: 1px solid var(--line); padding-top: 7px; }
    .lp-items li { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px;
      align-items: baseline; font-size: 12.5px; }
    .lp-items li b { font-family: var(--mono); font-size: 10px; color: var(--accent); font-weight: 600; }
    .lp-items li span { font-family: var(--mono); font-size: 11px; color: var(--ink-soft);
      font-variant-numeric: tabular-nums; }

    /* ── One language for every screen ───────────────────────────────────
       The week view arrived in a different idiom to the rest of the app -
       square edges, mono labels in small caps, flat surfaces - and a product
       that changes its accent when you click Office reads as two products
       bolted together.

       So the shared primitives move to that idiom here, which restyles every
       page at once without touching a line of their markup: Office, Clients,
       Invoices, Quotes, the job page. Same components, same classes, same
       behaviour - different clothes.

       Rounded corners and the card shadow are what go. They were doing the
       softening that a phone-first job list wanted; the calendar wants
       edges you can line things up against. */

    .topbar { padding: 10px 14px; }
    .topbar-link {
      font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
      text-transform: uppercase; color: var(--ink-soft);
    }
    .topbar-link:hover { color: var(--ink); }
    .brand-ws {
      border: 1px solid var(--line); padding: 4px 9px; font-size: 10.5px;
      letter-spacing: .12em; text-transform: uppercase;
    }

    h1 {
      font-size: 19px; font-weight: 700; letter-spacing: .14em;
      text-transform: uppercase; margin: 6px 0 18px; text-wrap: balance;
    }
    h2 {
      font-size: 10px; letter-spacing: .2em; opacity: 1; font-weight: 500;
      margin: 26px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--line);
    }

    .card { border-radius: 0; box-shadow: none; padding: 14px 15px; margin-bottom: 8px; }
    .card:active { transform: none; }
    /* A list of cards reads as a stack of strips rather than floating tiles:
       one hairline between them instead of twelve separate boxes. */
    .card + .card { margin-top: -9px; }

    .stamp { border-radius: 0; font-size: 9.5px; letter-spacing: .14em; padding: 3px 7px; }

    .btn {
      min-height: 46px; border-radius: 0; font-family: var(--mono);
      font-size: 11px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase;
    }
    .btn-ghost, .btn-warn { border-width: 1px; }
    .btn + .btn { margin-top: 8px; }

    input, select, textarea {
      border-radius: 0; border-width: 1px; padding: 10px 11px; margin-bottom: 10px;
    }
    label {
      font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em;
      text-transform: uppercase; margin-bottom: 4px;
    }

    .thumb { border-radius: 0; }
    .syncbadge { border-radius: 0; letter-spacing: .12em; }
    .empty { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; }

    /* ── The week view ────────────────────────────────────────────────────
       Everything here is prefixed wk- on purpose. The app already owns
       .card, .job, .row, .panel and a dozen other short names, and a
       calendar that quietly restyled the job list would be a nasty way to
       find that out.

       The palette is the app's own: the grid is --card, the chrome around
       it --bg, and the accent is the same safety orange as everywhere else.
       Only the tints below are new, and each is a wash of a colour the app
       already uses. */
    :root {
      --wk-hour: 56px;              /* must match HOUR in Week.jsx */
      --wk-soft: #F6F5F2;           /* chrome: rails and bars */
      --wk-sink: #ECEAE4;           /* recessed strips inside the chrome */
      --wk-hair: #F1EFEA;           /* hour lines inside the grid */
      --wk-sched: #F7F1E8;          /* scheduled */
      --wk-open: #FBEAE8;           /* needs a decision */
      --wk-new: #FCF2E2;            /* not confirmed */
      --wk-done: #ECF3EF;           /* finished */
    }

    /* #root is a column flex at full viewport height and the top bar is a
       sticky child of it, so the week takes whatever is left - no guessing at
       the bar's height, and the notices strip above it can grow without
       pushing the grid off the bottom of the screen. */
    .wk {
      flex: 1; min-height: 0;
      display: grid; grid-template-rows: auto 1fr auto;
      background: var(--card); color: var(--ink);
    }
    .wk button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

    .wk-bar {
      display: flex; align-items: baseline; gap: 12px; padding: 10px 14px;
      border-bottom: 1px solid var(--line); background: var(--wk-soft);
      overflow-x: auto; scrollbar-width: none;
    }
    .wk-bar::-webkit-scrollbar { display: none; }
    .wk-h1 {
      margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .16em;
      text-transform: uppercase; white-space: nowrap;
    }
    .wk-range { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); letter-spacing: .08em; white-space: nowrap; }
    .wk-step { display: flex; gap: 2px; margin-left: 8px; }
    .wk-step button { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); padding: 3px 9px; border: 1px solid var(--line); }
    .wk-step button:hover { color: var(--accent); border-color: var(--ink-soft); }
    .wk-flags { margin-left: auto; display: flex; gap: 8px; align-self: center; }
    .wk-flag {
      display: flex; align-items: center; gap: 7px; padding: 5px 11px 5px 9px;
      border: 1px solid var(--line); background: var(--card);
      font-family: var(--mono); font-size: 11px; letter-spacing: .1em; color: var(--ink-soft);
      white-space: nowrap;
    }
    .wk-flag:hover, .wk-flag.on { color: var(--ink); border-color: var(--ink-soft); }
    .wk-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .wk-dot.open { background: var(--warn); box-shadow: 0 0 0 3px rgba(194,27,27,.14); }
    .wk-dot.new { background: var(--accent); box-shadow: 0 0 0 3px rgba(240,74,0,.14); }
    .wk-railtog { display: none; font-family: var(--mono); font-size: 11px; color: var(--ink-soft); border: 1px solid var(--line); padding: 4px 8px; }

    .wk-body { display: grid; grid-template-columns: 232px 1fr; min-height: 0; position: relative; }
    .wk-rail { border-right: 1px solid var(--line); background: var(--wk-soft); overflow-y: auto; padding: 14px 12px 24px; }
    .wk-rail h2 {
      font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--ink-soft);
      font-weight: 500; margin: 20px 0 8px; text-transform: uppercase;
    }
    .wk-hint { font-size: 11.5px; color: var(--ink-soft); margin: 6px 0 0; }

    /* the only filled button on the screen */
    .wk-new {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
      padding: 11px 10px; margin-bottom: 16px; background: var(--ink); color: #fff;
      font-family: var(--mono); font-size: 11px; letter-spacing: .18em; border: 1px solid var(--ink);
    }
    .wk-new:hover { background: var(--accent); border-color: var(--accent); }
    .wk-new b { font-size: 14px; font-weight: 400; line-height: 1; }

    .wk-minihead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .wk-minihead span { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; }
    .wk-minihead button { color: var(--ink-soft); padding: 2px 6px; font-family: var(--mono); }
    .wk-minihead button:hover { color: var(--accent); }
    .wk-mini { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
    .wk-mini i { font-style: normal; font-family: var(--mono); font-size: 9px; color: var(--ink-soft); text-align: center; padding: 3px 0; }
    .wk-mini button { font-family: var(--mono); font-size: 11px; padding: 4px 0; text-align: center; font-variant-numeric: tabular-nums; }
    .wk-mini button.out { color: #AFB4B2; }
    .wk-mini button:hover { background: var(--line); }
    .wk-mini button.inweek { background: var(--wk-sink); }
    .wk-mini button.today { color: #fff; background: var(--accent); font-weight: 700; }

    .wk-loose { display: flex; flex-direction: column; gap: 3px; }
    .wk-filters { display: flex; flex-direction: column; gap: 1px; }
    /* Six rows, then it scrolls. A workspace with thirty customers would
       otherwise push the job-type filters off the bottom of the rail. */
    .wk-filters.scrolls { max-height: 222px; overflow-y: auto; overscroll-behavior: contain; }
    .wk-filters.scrolls::-webkit-scrollbar { width: 6px; }
    .wk-filters.scrolls::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
    .wk-frowwrap { display: flex; align-items: center; }
    .wk-frowwrap .wk-frow { min-width: 0; flex: 1; }
    .wk-unpin {
      flex: none; font-family: var(--mono); font-size: 10px; color: var(--ink-soft);
      padding: 4px 6px; opacity: 0;
    }
    .wk-frowwrap:hover .wk-unpin { opacity: 1; }
    .wk-unpin:hover { color: var(--warn); }
    .wk-add {
      width: 100%; margin-top: 6px; font-family: var(--mono); font-size: 10px;
      letter-spacing: .1em; color: var(--accent); background: var(--card);
      border: 1px dashed var(--line); padding: 7px 8px; cursor: pointer;
    }
    .wk-add:hover { border-color: var(--accent); }
    .wk-frow {
      display: flex; align-items: center; gap: 9px; padding: 6px 8px 6px 4px;
      text-align: left; width: 100%; font-size: 13px; color: var(--ink-soft);
    }
    .wk-frow:hover { background: var(--wk-sink); color: var(--ink); }
    .wk-frow .cursor { width: 10px; flex: none; font-family: var(--mono); font-size: 11px; color: var(--accent); opacity: 0; }
    .wk-frow[aria-pressed="true"] { color: var(--ink); }
    .wk-frow[aria-pressed="true"] .cursor { opacity: 1; }
    .wk-frow .swatch { width: 12px; height: 12px; flex: none; border: 1px solid var(--ink-soft); }
    .wk-frow[aria-pressed="true"] .swatch { background: var(--ink-soft); }
    .wk-frow .swatch.s-open { border-color: var(--warn); }
    .wk-frow[aria-pressed="true"] .swatch.s-open { background: var(--warn); }
    .wk-frow .swatch.s-new { border-color: var(--accent); }
    .wk-frow[aria-pressed="true"] .swatch.s-new { background: var(--accent); }
    .wk-frow .swatch.s-done { border-color: var(--ok); }
    .wk-frow[aria-pressed="true"] .swatch.s-done { background: var(--ok); }
    .wk-frow .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wk-frow .count { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--ink-soft); }
    .wk-railbtn { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; color: var(--ink-soft); padding: 4px 0; }
    .wk-railbtn:hover { color: var(--accent); }

    .wk-week { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--card); }
    .wk-cols, .wk-band, .wk-grid { display: grid; grid-template-columns: 52px repeat(7, minmax(0, 1fr)); }
    .wk-cols { border-bottom: 1px solid var(--line); }
    .wk-dayhead { padding: 7px 8px; border-left: 1px solid var(--line); text-align: center; }
    .wk-dayhead .dow { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; color: var(--ink-soft); }
    .wk-dayhead .num { font-family: var(--mono); font-size: 17px; font-variant-numeric: tabular-nums; line-height: 1.2; }
    .wk-dayhead.istoday .num, .wk-dayhead.istoday .dow { color: var(--accent); font-weight: 700; }

    .wk-band { border-bottom: 1px solid var(--line); background: var(--wk-sink); min-height: 36px; }
    .wk-band .label { font-family: var(--mono); font-size: 9px; letter-spacing: .1em; color: var(--ink-soft); padding: 7px 6px; text-align: right; line-height: 1.15; }
    .wk-band .cell { border-left: 1px solid var(--line); padding: 4px; display: flex; flex-direction: column; gap: 3px; }
    .wk-band .cell.over { background: #E4DFD3; box-shadow: inset 0 0 0 1px var(--accent); }

    .wk-scroll { overflow-y: auto; flex: 1; min-height: 0; }
    .wk-gutter { position: relative; }
    .wk-gutter .hr {
      height: var(--wk-hour); font-family: var(--mono); font-size: 10px; color: var(--ink-soft);
      text-align: right; padding-right: 7px; transform: translateY(-6px); font-variant-numeric: tabular-nums;
    }
    /* the first label would be sliced in half by the top of the scroller */
    .wk-gutter .hr:first-child { color: transparent; }
    .wk-col { border-left: 1px solid var(--line); position: relative; }
    .wk-col .slot { height: var(--wk-hour); border-bottom: 1px solid var(--wk-hair); }
    .wk-col.over { background: #FDF8F2; }
    .wk-now { position: absolute; left: 0; right: 0; height: 1px; background: var(--warn); z-index: 5; }
    .wk-now::before { content: ""; position: absolute; left: -4px; top: -3.5px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
    .wk-drop { position: absolute; left: 1px; right: 1px; z-index: 6; pointer-events: none; border: 1px dashed var(--accent); background: rgba(240,74,0,.07); }
    .wk-drop span { position: absolute; top: -8px; left: 4px; font-family: var(--mono); font-size: 9px; background: var(--accent); color: #fff; padding: 1px 4px; }

    .wk-job {
      position: absolute; overflow: hidden; text-align: left; padding: 4px 6px;
      border-left: 3px solid var(--ink-soft); background: var(--wk-sched);
      font-size: 11.5px; line-height: 1.3; cursor: grab; touch-action: none;
    }
    .wk-job:hover { filter: brightness(.97); }
    .wk-job .t { font-family: var(--mono); font-size: 9.5px; color: var(--ink-soft); }
    .wk-job .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wk-job .c { color: var(--ink-soft); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wk-job.s-open { border-left-color: var(--warn); background: var(--wk-open); }
    .wk-job.s-new { border-left-color: var(--accent); background: var(--wk-new); }
    .wk-job.s-done { border-left-color: var(--ok); background: var(--wk-done); color: var(--ink-soft); }
    .wk-job.sel { outline: 1.5px solid var(--ink); outline-offset: -1px; }

    .wk-chip {
      font-family: var(--mono); font-size: 9px; letter-spacing: .06em; padding: 4px 5px;
      border-left: 3px solid var(--ink-soft); background: var(--wk-sched); text-align: left;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; width: 100%;
      cursor: grab; touch-action: none;
    }
    .wk-chip.s-open { border-left-color: var(--warn); background: var(--wk-open); }
    .wk-chip.s-new { border-left-color: var(--accent); background: var(--wk-new); }
    .wk-chip .u { color: var(--accent); font-weight: 700; }

    .wk-ghost {
      position: fixed; z-index: 100; pointer-events: none; padding: 5px 8px; background: var(--card);
      border: 1px solid var(--ink); border-left: 3px solid var(--accent); font-size: 11.5px;
      box-shadow: 0 6px 18px rgba(16,19,20,.18); max-width: 240px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }

    .wk-foot { display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 36px; border-top: 1px solid var(--line); background: var(--wk-soft); }
    .wk-foot .say { font-family: var(--mono); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wk-foot .say::before { content: "▸ "; color: var(--accent); }
    .wk-foot .keys { margin-left: auto; display: flex; gap: 10px; flex: none; }
    .wk-foot .keys span { font-family: var(--mono); font-size: 10px; color: var(--ink-soft); }
    .wk-foot kbd { font-family: var(--mono); border: 1px solid var(--line); background: var(--card); padding: 1px 5px; margin-right: 4px; font-size: 10px; }

    .wk-scrim { position: fixed; inset: 0; background: rgba(16,19,20,.28); z-index: 40; }
    .wk-panel {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); z-index: 50;
      background: var(--wk-soft); border-left: 1px solid var(--line); display: flex;
      flex-direction: column; box-shadow: -10px 0 30px rgba(16,19,20,.08);
    }
    .wk-panel header { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 12px; background: var(--card); }
    .wk-panel header h3 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .12em; }
    .wk-panel header .x { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
    .wk-panel .inner { padding: 14px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .wk-ptitle { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .wk-kv { display: grid; grid-template-columns: 76px 1fr; gap: 4px 10px; font-size: 13px; margin: 0; }
    .wk-kv dt { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: var(--ink-soft); padding-top: 3px; }
    .wk-kv dd { margin: 0; }
    .wk-h4 { margin: 0 0 7px; font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--ink-soft); font-weight: 500; }
    .wk-note { font-size: 12px; color: var(--ink-soft); margin: 0; }

    .wk-docs { display: flex; flex-direction: column; gap: 1px; }
    .wk-doc { display: flex; align-items: center; gap: 9px; padding: 7px 8px; background: var(--card); border-left: 3px solid var(--line); }
    .wk-doc .kind { font-family: var(--mono); font-size: 9px; letter-spacing: .08em; color: var(--ink-soft); width: 46px; flex: none; }
    .wk-doc .ref { font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wk-doc .meta { font-size: 10.5px; color: var(--ink-soft); margin-left: auto; flex: none; }
    .wk-doc .ops { display: flex; gap: 3px; flex: none; }
    .wk-doc .ops button { font-family: var(--mono); font-size: 9px; padding: 3px 6px; border: 1px solid var(--line); color: var(--ink-soft); }
    .wk-doc .ops button:hover { color: var(--accent); border-color: var(--accent); }

    .wk-plist { display: flex; flex-direction: column; gap: 1px; }
    .wk-pitem { display: flex; gap: 10px; align-items: flex-start; padding: 9px 8px; text-align: left; width: 100%; border-left: 3px solid var(--line); background: var(--card); }
    .wk-pitem:hover { background: var(--wk-sink); }
    .wk-pitem.s-open { border-left-color: var(--warn); }
    .wk-pitem.s-new { border-left-color: var(--accent); }
    .wk-pitem .when { font-family: var(--mono); font-size: 10px; color: var(--ink-soft); flex: none; width: 54px; }
    .wk-pitem .body { min-width: 0; }
    .wk-pitem .body .n { font-size: 13px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wk-pitem .body .c { font-size: 11px; color: var(--ink-soft); }

    .wk-act { display: flex; gap: 6px; flex-wrap: wrap; }
    .wk-act button { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; padding: 8px 12px; border: 1px solid var(--line); background: var(--card); }
    .wk-act button:hover { border-color: var(--accent); color: var(--accent); }
    .wk-act button.go { background: var(--ink); color: #fff; border-color: var(--ink); }
    .wk-act button.go:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* shared with the new-job page */
    .wk-shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
    .wk-shot {
      aspect-ratio: 4/3; background: var(--wk-sink); border: 1px solid var(--line); position: relative;
      background-size: cover; background-position: center; display: grid; place-items: center;
      font-family: var(--mono); font-size: 9px; color: var(--ink-soft); letter-spacing: .08em;
    }
    .wk-shot.add { cursor: pointer; border-style: dashed; color: var(--accent); background: var(--card); }
    .wk-shot.add:hover { border-color: var(--accent); background: #FFF6F1; }
    .wk-x { position: absolute; top: 3px; right: 3px; font-size: 10px; line-height: 1; padding: 2px 5px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
    /* It is a <label>, so it inherits the mono small-caps every other label
       wears. Its blurb is a sentence and has to read like one. */
    .wk-drop-file {
      display: flex; flex-direction: column; gap: 3px; cursor: pointer; padding: 14px;
      border: 1px dashed var(--line); background: var(--bg); text-align: center;
      text-transform: none; letter-spacing: normal; font-family: var(--sans);
    }
    .wk-drop-file:hover { border-color: var(--accent); }
    .wk-drop-file strong { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
    .wk-drop-file span { font-size: 12px; color: var(--ink-soft); line-height: 1.5; }

    @media (max-width: 860px) {
      .wk-body { grid-template-columns: 1fr; }
      .wk-rail { display: none; }
      .wk-rail.on { display: block; position: absolute; top: 0; bottom: 0; left: 0; width: 232px; z-index: 30; }
      .wk-railtog { display: block; }
    }
    @media print { .wk { display: block; } .wk-rail, .wk-foot, .wk-bar .wk-step { display: none; } }

</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
